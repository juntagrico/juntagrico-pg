name: juntagrico-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'releases/**' ]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: juntagrico
          POSTGRES_PASSWORD: juntagrico
          POSTGRES_DB: juntagrico
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: testsettings
      PYTHONPATH: .
      COVERAGE_FILE: coverage
      JUNTAGRICO_DATABASE_ENGINE: django.db.backends.postgresql
      JUNTAGRICO_DATABASE_NAME: juntagrico
      JUNTAGRICO_DATABASE_USER: juntagrico
      JUNTAGRICO_DATABASE_PASSWORD: juntagrico
      JUNTAGRICO_DATABASE_HOST: localhost
      JUNTAGRICO_DATABASE_PORT: 5432
    strategy:
      matrix:
        include:
          - python-version: '3.10'
          - python-version: '3.11'
          - python-version: '3.12'
          - python-version: '3.13'
          - python-version: '3.14'

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: install dependencies
      run: |
        pip install --upgrade -r requirements.txt "psycopg[binary]"
    - name: ruff
      run: |
        ruff check --preview juntagrico_pg
    - name: make migrations
      run: python -m django makemigrations --noinput
    - name: run tests
      run: python -m manage test
      if: ${{ matrix.python-version  != '3.11' }}
    - name: run tests
      run: coverage run -m manage test
      if: ${{ matrix.python-version  == '3.11' }}
    - run: coverage lcov -o coverage.lcov
      if: ${{ matrix.python-version  == '3.11' }}
    - uses: actions/upload-artifact@v6
      if: ${{ matrix.python-version  == '3.11' }}
      with:
        name: coverage
        path: coverage.lcov

  coverage:
    name: Coverage Report
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: coverage
          merge-multiple: true
      - uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/coverage*.lcov
